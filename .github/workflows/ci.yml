name: Continuous Integration

on:
  push:
    branches:
      - main
      - Week-3
  pull_request:
    branches:
      - main
      - Week-3

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov coverage

    - name: Run linting
      run: |
        # Run flake8, but do not fail workflow on lint errors
        flake8 . || true
        # You can switch to ruff if preferred
        # ruff . || true

    - name: Run tests with coverage
      run: |
        pytest --cov=your_module --cov-fail-under=80

    - name: Display coverage report
      run: |
        coverage report -m